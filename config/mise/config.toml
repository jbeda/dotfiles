# Global mise tool pins, linked to ~/.config/mise/config.toml by ./install,
# which also runs `mise install` to realize them. Edit this file in the repo
# rather than running `mise use -g` -- mise rewrites the global config on
# `use -g`, which can replace the symlink with a plain file and orphan it
# from the repo.

[tools]
node = "lts"
go = "1.27"

[settings]
# Without this mise points GOBIN at its versioned install dir
# (~/.local/share/mise/installs/go/<ver>/bin), so `go install` binaries are
# orphaned off PATH on every Go upgrade. Unset, Go defaults GOBIN to
# $GOPATH/bin (~/src/go/bin), which 40_path.sh already puts on PATH.
go.set_gobin = false
