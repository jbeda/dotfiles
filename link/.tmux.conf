# ~/.tmux.conf
#
# Goal: a comfortable long-running session on this machine that survives
# detach/reattach over SSH from Ghostty. Prefix is Ctrl-Space (see below);
# mentally swap it in when reading online cheat sheets written for Ctrl-b.

# --- Prefix ---------------------------------------------------------------
# Ctrl-Space instead of the default Ctrl-b. Ctrl-Space Ctrl-Space sends a
# literal Ctrl-Space through to the program in the pane.
unbind C-b
set  -g  prefix C-Space
bind C-Space send-prefix

# --- Terminal & color ----------------------------------------------------
# tmux-256color is the correct terminfo for tmux itself (replaces the old
# screen-256color). The terminal-features line tells tmux that the OUTER
# terminal (Ghostty) can do 24-bit truecolor, so colors pass through.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-features ",xterm-ghostty:RGB"
set  -ga terminal-overrides ",*256col*:Tc"

# The lines above make tmux *pass* 24-bit color through to Ghostty. This line
# tells programs running INSIDE tmux that truecolor is available. Without it,
# TERM=tmux-256color + an empty COLORTERM makes color-depth probes (Node's
# supports-color, used by Claude Code) fall back to 256 and quantize 24-bit
# status-line colors to the nearest palette entry -- visibly muted vs. running
# in Ghostty directly, where Ghostty exports COLORTERM=truecolor itself. ssh
# doesn't forward COLORTERM, so assert it here for tmux's children.
set-environment -g COLORTERM truecolor

# COLORTERM gets Claude Code's base detection to truecolor, but Claude then
# *deliberately* downgrades to 256 whenever $TMUX is set (a guard against
# misconfigured tmux truecolor) unless this escape-hatch var is present. Our
# tmux passes 24-bit through cleanly (verified), so opt out of the downgrade.
# See anthropics/claude-code#46146. Without it the status line renders muted.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Let programs inside tmux write to the system clipboard via OSC 52. Ghostty
# forwards this to your Mac clipboard even over SSH, so copy-mode yanks land
# on your local clipboard. (Ghostty may prompt/limit large writes.)
set  -g  set-clipboard on

# Forward extended-key sequences (kitty keyboard protocol / CSI-u) from the
# outer terminal to programs in the pane. Without this, tmux collapses keys
# like Shift-Enter back to plain Enter, so Claude Code can't tell them apart
# (Shift-Enter = newline instead of submit). `on` = advertise + forward to
# apps that ask; extkeys tells tmux Ghostty can carry them.
set  -s  extended-keys on
set  -ga terminal-features ",xterm-ghostty:extkeys"

# --- General behavior ----------------------------------------------------
set  -g  mouse on               # scroll, click panes/windows, drag borders

# Mouse click: select the pane AND forward the click to the app (tmux default).
# We briefly dropped the `send -M` forward so focus always landed on the first
# click even in mouse-grabbing apps (Claude Code, vim, less -> mouse_any_flag=1).
# But without the forward the app never sees the mouse, which breaks drag-to-select
# for copy/paste inside Claude Code -- a worse tradeoff than the occasional
# two-click focus. Keep the forward. (To go back to guaranteed one-click focus at
# the cost of in-app mouse selection, drop the `\; send -M`.)
bind -n MouseDown1Pane select-pane -t= \; send -M
set  -g  history-limit 50000    # deep scrollback for long agent output
set  -s  escape-time 10         # don't treat ESC as the start of a sequence
set  -g  focus-events on        # apps (vim/emacs) learn when a pane is focused
set  -g  display-time 2000      # status messages linger ~2s

# Windows/panes number from 1 (0 is a stretch from 1 on the keyboard).
# `prefix <n>` still selects window n -- only the labels shift.
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on    # close a window, no numbering gaps

# Keep the terminal/Ghostty tab title in sync with the tmux session/window.
set  -g  set-titles on
set  -g  set-titles-string "#S  #I:#W"

# Copy-mode uses emacs keys, matching your shell line-editing habits.
setw -g  mode-keys emacs

# The default emacs begin-selection key is C-Space, which the prefix now
# swallows (the prefix wins over copy-mode bindings). Use Space instead
# (vi-style); paging down is still PgDn / the mouse wheel.
bind -T copy-mode Space send -X begin-selection

# --- Convenience bindings (additive; defaults still work) -----------------
# prefix r  -> reload this file without restarting tmux
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Splits keep the current pane's working directory. The default keys (% and ")
# are rebound to add that behavior; | and - are friendly mnemonic aliases.
bind %   split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# prefix i -> pull the Mac's clipboard image onto this box and type its path
# into the current pane (e.g. straight into a Claude Code prompt, which loads
# an image from a plain path). Runs `paste-image` over the reverse mac-bridge;
# the round-trip blocks briefly. On no-image / bridge-down, shows a message and
# types nothing. See linux/bin/paste-image and darwin/mac-bridge/.
bind i run-shell "p=\"\$(~/.local/bin/paste-image --quiet)\" && tmux send-keys -t '#{pane_id}' -l -- \"\$p \" || tmux display-message 'paste-image: no clipboard image, or mac-bridge down'"

# --- Prefixless pane/window movement (root table, no prefix) --------------
# Left Option is Meta in Ghostty, so Option+Shift+<key> arrives as M-S-<key>;
# `extended-keys on` (above) makes these modified combos reliable. `-n` binds
# them in the root table so they work WITHOUT the prefix -- the tradeoff is the
# focused app never sees these combos, which is fine as shells/Claude Code don't
# use them.
#
# Panes: Option+Shift+Arrow. (Plain Option+Arrow is left alone -- zsh/readline
# use it for word movement.)
bind -n M-S-Left  select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up    select-pane -U
bind -n M-S-Down  select-pane -D

# Windows, tab-style cycling: Option+Tab -> next, Option+Shift+Tab -> previous
# (both wrap around). Meta+Tab is reliably distinct in every terminal encoding
# and Ghostty's own shortcuts are Cmd-based, so it won't intercept these -- which
# is why this works where Option+Shift+[ / ] didn't (shifted-bracket encoding is
# terminal-specific and Ghostty wasn't sending what tmux expected). Shift+Tab can
# arrive as M-S-Tab or M-BTab (back-tab), so bind both for the previous direction.
bind -n M-Tab   next-window
bind -n M-S-Tab previous-window
bind -n M-BTab  previous-window

# Fallback / bonus: Option+<n> jumps straight to window n. Uncomment if you want
# direct jumps as well.
# bind -n M-1 select-window -t 1
# bind -n M-2 select-window -t 2
# bind -n M-3 select-window -t 3
# bind -n M-4 select-window -t 4
# bind -n M-5 select-window -t 5
# bind -n M-6 select-window -t 6
# bind -n M-7 select-window -t 7
# bind -n M-8 select-window -t 8
# bind -n M-9 select-window -t 9

# --- Pane resize ----------------------------------------------------------
# Resize does NOT live on Option+Arrow: Ghostty binds alt+left/alt+right to
# esc:b / esc:f by default (emacs word-motion for zsh), firing on the physical
# chord before macos-option-as-alt translation -- so tmux never sees M-Left/Right
# and can't resize horizontally there. (Option+Up/Down are unbound in Ghostty and
# would work, but splitting resize across two mechanisms is worse than one.) So
# resize lives on plain arrows under the prefix instead, colliding with nothing.
#
# Two ways, both installed:
#
# 1) Quick nudge: prefix then arrows. `-r` makes them repeatable -- press prefix
#    ONCE, then tap any mix of arrows within repeat-time (below); overshoot is
#    correctable with the opposite arrow, no re-prefix. 5 cells/tap (coarse).
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
set  -g  repeat-time 1000       # window (ms) to keep tapping -r bindings

# 2) Sustained layout mode: prefix R -> arrows MOVE between panes, Shift+arrow
#    RESIZES, [ / ] SWAP the active pane toward the front/back of the pane order
#    (front = the "main" pane in the main-* layouts), and Space cycles the preset
#    LAYOUTS. No timeout and no repeated prefix -- rearrange freely until you
#    press Escape (or any unbound key, which falls back to the root table and
#    exits). Each binding re-enters the table to stay in the mode.
#
# tmux has no format for the current preset layout NAME (window_layout is only
# geometry), so Space drives the cycle itself: it reads the last name from the
# @panelayout window option, applies the next preset, and stores the new name --
# which the status banner shows so you can see where you are in the order. The
# order matches tmux's native next-layout: even-h -> even-v -> main-h -> main-v
# -> tiled -> (wrap). @panelayout defaults to "custom" (set in Preset layouts
# below) until the first cycle; a manual resize afterward leaves the label on the
# last preset applied, i.e. "what layout was last stamped here".
bind R switch-client -T panemode
bind -T panemode Up      select-pane -U   \; switch-client -T panemode
bind -T panemode Down    select-pane -D   \; switch-client -T panemode
bind -T panemode Left    select-pane -L   \; switch-client -T panemode
bind -T panemode Right   select-pane -R   \; switch-client -T panemode
bind -T panemode S-Up    resize-pane  -U 5 \; switch-client -T panemode
bind -T panemode S-Down  resize-pane  -D 5 \; switch-client -T panemode
bind -T panemode S-Left  resize-pane  -L 5 \; switch-client -T panemode
bind -T panemode S-Right resize-pane  -R 5 \; switch-client -T panemode
bind -T panemode "["     swap-pane    -U   \; switch-client -T panemode
bind -T panemode "]"     swap-pane    -D   \; switch-client -T panemode
bind -T panemode Space   run-shell 'cur="#{@panelayout}"; case "$cur" in even-horizontal) n=even-vertical;; even-vertical) n=main-horizontal;; main-horizontal) n=main-vertical;; main-vertical) n=tiled;; *) n=even-horizontal;; esac; tmux select-layout "$n"; tmux set -w @panelayout "$n"' \; switch-client -T panemode

# --- Preset layouts -------------------------------------------------------
# The main-* layouts (prefix M-3 main-horizontal, M-4 main-vertical) size their
# big "main" pane by main-pane-height/width, which default to an ABSOLUTE 24
# lines / 80 cols. In a large window that makes the main pane the SMALLER one.
# Percentages (accepted since 3.5a here) keep it proportional instead. Note:
# changing these doesn't reflow the current window -- re-apply the layout
# (prefix Space, or prefix : select-layout main-horizontal) to see it.
set  -g  main-pane-height 70%   # main-horizontal: main (top) pane = 70% tall
set  -g  main-pane-width  70%   # main-vertical:   main (left) pane = 70% wide

# Tracks the last preset layout stamped by pane mode's Space cycle (see above),
# shown in the PANE MODE banner. Global window default; the cycle overrides it
# per-window. "custom" = no preset applied via the cycle yet.
set  -wg @panelayout "custom"

# --- Status bar (top, solarized) -----------------------------------------
# On top so it's clearly tmux's chrome, distinct from Claude Code's own status
# lines at the bottom of a pane. Solid solarized bar (not the default bg) so it
# reads as a bar; active window highlighted green, active pane border bright cyan
# (which is also how you SEE mouse/keyboard focus move between panes).
set  -g  status-position top
set  -g  status-interval 5
set  -g  status-style        "bg=#073642,fg=#839496"
# status-left shows the session name, then -- only while the `panemode` key-table
# is active (prefix R) -- a loud magenta banner so it's unmistakable that arrows
# are captured for move/resize. The banner disappears when you Escape out.
#
# The banner's style is split into single-directive #[...] blocks ON PURPOSE:
# a comma inside a style (#[fg=x,bg=y,bold]) is read as a #{?cond,a,b} branch
# separator, which mis-splits the conditional -- the tail leaks as literal text
# and renders even when the condition is false. Comma-free blocks avoid that.
set  -g  status-left         "#[fg=#002b36,bg=#268bd2,bold] #S #[fg=#268bd2,bg=#073642] #{?#{==:#{client_key_table},panemode},#[fg=#fdf6e3]#[bg=#d33682]#[bold] PANE MODE  arrows move · shift resize · [] swap · space layout ⟨#{@panelayout}⟩ · esc exit #[default] ,}"
set  -g  status-left-length  80
set  -g  status-right        "#[fg=#586e75] #H #[fg=#839496] %Y-%m-%d %H:%M "
set  -g  window-status-current-format "#[fg=#002b36,bg=#859900,bold] #I:#W#F "
set  -g  window-status-format         "#[fg=#839496] #I:#W#F "
set  -g  window-status-separator      ""

# Pane focus indicator. The border color alone is too subtle, so also label each
# pane on its border line and draw the ACTIVE one as a filled cyan block -- hard
# to miss at a glance. pane-border-status only appears once a window is split, so
# it costs no space in a single-pane window (exactly when you don't need it).
set  -g  pane-border-style        "fg=#586e75"
set  -g  pane-active-border-style "fg=#2aa198,bold"
set  -g  pane-border-status top
set  -g  pane-border-format "#{?pane_active,#[fg=#002b36]#[bg=#2aa198]#[bold] #P:#{pane_current_command} #[default],#[fg=#586e75] #P:#{pane_current_command} }"

# Optional stronger cue: dim the CONTENT of inactive panes. Uncomment to enable.
# Caveat: apps that set their own colors (Claude Code) largely override this, so
# it dims plain shells cleanly but TUIs only partially.
# set -g window-style        "fg=#657b83"
# set -g window-active-style "fg=terminal,bg=terminal"

# --- Persistence across reboots (resurrect + continuum) ------------------
# Vendored as git submodules under this repo (no plugin manager needed).
# resurrect: save/restore window & pane layout, cwd, and shell history.
#   prefix C-s  save     prefix C-r  restore
# continuum: automates it -- saves every 15 min and restores on server start.
#
# Note: a reboot kills any running process (agents included). These restore
# the *layout and shells* so you can relaunch quickly; they don't preserve a
# live process's in-memory state. Plain detach/reattach (no reboot) keeps
# processes running natively -- that's tmux itself, no plugin required.
set  -g  @resurrect-capture-pane-contents 'on'   # restore visible scrollback
set  -g  @continuum-restore 'on'                  # auto-restore on tmux start
set  -g  @continuum-save-interval '15'            # minutes between autosaves

run-shell ~/src/dotfiles/third_party/tmux-resurrect/resurrect.tmux
run-shell ~/src/dotfiles/third_party/tmux-continuum/continuum.tmux
